      - name: Install ldid
        run: brew install ldid || brew install xerub/ldid/ldid

      - name: Install Theos (roothide) + iOS SDK
        run: |
          set -e
          export THEOS=$HOME/theos
          git clone --quiet --recursive https://github.com/roothide/theos.git "$THEOS"
          echo "THEOS=$THEOS" >> "$GITHUB_ENV"
          mkdir -p "$THEOS/sdks"
          git clone -n --depth=1 --filter=tree:0 https://github.com/theos/sdks.git /tmp/sdks
          cd /tmp/sdks
          git sparse-checkout set --no-cone iPhoneOS16.5.sdk
          git checkout
          cp -r iPhoneOS16.5.sdk "$THEOS/sdks/"

      - name: Build package
        run: |
          set -e
          make clean || true
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=roothide
          ls -la packages/

      - name: Upload .deb (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: nxdesktop-deb
          path: packages/*.deb

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: NXDesktop build ${{ github.run_number }}
          files: packages/*.deb
